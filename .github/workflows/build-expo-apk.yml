name: Build Expo Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-expo:
    name: Build Expo React Native Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: expo-app/package-lock.json

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Expo Prebuild (Generate Native Android Project)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Standalone Android APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/rabbit-expo-assistant-debug.apk

      - name: Upload Expo Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-expo-assistant-apk
          path: expo-app/output_apk/rabbit-expo-assistant-debug.apk
          retention-days: 14
